schema_version: 1

context:
  version: "0.45.0"

package:
  name: perplexityai
  version: ${{ version }}

source:
  url: https://github.com/perplexityai/perplexity-py/archive/refs/tags/v${{ version }}.tar.gz
  sha256: cf60173802b68da570eb36d346d2f81723c0026bab618249ad51d2430a2c8f75
  # https://github.com/perplexityai/perplexity-py/pull/120
  patches:
    - license.patch

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling ==1.26.3
    - hatch-fancy-pypi-readme
    - pip
  run:
    - python >=${{ python_min }}
    - httpx >=0.23.0,<1
    - pydantic >=2,<3
    - typing_extensions >=4.14,<5
    - anyio >=3.5.0,<5
    - distro >=1.7.0,<2
    - sniffio

tests:
  - python:
      imports:
        - perplexity
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: The official Python library for the perplexity API
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://github.com/perplexityai/perplexity-py

extra:
  recipe-maintainers:
    - Aleksei-Poliakov
